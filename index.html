<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: su iPhone il contenuto arriva sotto il notch,
         e styles.css usa già env(safe-area-inset-*) per non finirci sotto -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8F4" />
    <meta name="description" content="Un percorso personale verso una vita senza fumo. Un passo alla volta, insieme a qualcuno." />

    <!-- Icone e manifest: è quello che trasforma "Aggiungi a schermata Home"
         in un'app vera — icona sua nel telefono, apertura a schermo intero,
         niente barra del browser. Senza il manifest resta un segnalibro.
         I PNG si rigenerano dal logo con: python3 strumenti/genera-icone.py -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iPhone e iPad ignorano il manifest per l'icona e per la modalità a
         schermo intero: vogliono ancora questi tre tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" e non più "black-translucent": con il tema chiaro le
         scritte bianche della barra di stato sparivano sul fondo crema. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smetto" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Verifica anti-bot davanti ad accesso, registrazione e cambio
         password. Lo script sta qui e non dentro un componente per due
         ragioni: serve una volta sola per pagina, e un componente che se
         lo carica da sé deve poi riscriversi a mano il controllo che
         evita di inserirlo due volte.

         `render=explicit` NON è opzionale con React: senza, appena si
         carica Turnstile va a cercare da solo gli elementi `.cf-turnstile`
         e disegna dentro un nodo che il render successivo può già aver
         sostituito — widget fantasma e nessun token. Il montaggio lo
         comanda src/components/Turnstile.jsx.

         `async defer` vuol dire che al primo render `window.turnstile`
         può ancora non esserci: il componente aspetta, non dà per
         scontato.

         L'origine qui sotto dev'essere la stessa che compare in
         `script-src` dentro vercel.json, e `verifica/intestazioni.mjs`
         controlla proprio questo, nei due versi. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <title>Smetto</title>
  </head>
  <body>
    <!-- main.jsx monta qui: senza questo div l'app non parte -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
